# DBHub configuration -- https://dbhub.ai/config/toml
#
# DBHub is the real MCP server this project talks to. It is launched as a
# child process by mcp_client.py; you do not normally start it by hand.
#
# WHY A TOML FILE AND NOT CLI FLAGS: `readonly` and `max_rows` are tool-level
# settings and DBHub has no command-line flag for either of them. They exist
# only here. Without this file DBHub defaults to readonly = false and
# unlimited rows, i.e. a writable database handed to a language model.

[[sources]]
id = "company"
description = "Company demo database: employees, customers, orders, and the curated v_* views."
# SQLite path, resolved relative to the process working directory, which
# mcp_client.py sets to this project folder. Point this at your real database
# when you deploy -- see README "Point it at your real database".
#   sqlite:///./demo.db
#   postgres://agent_ro:pass@dbhost:5432/yourdb?sslmode=require
#   mysql://agent_ro:pass@dbhost:3306/yourdb
dsn = "sqlite:///./demo.db"

[[tools]]
name = "execute_sql"
source = "company"
# Layer 1 of read-only enforcement lives here: DBHub checks each statement
# against its read-only keyword allow-list AND runs it under SQLite's
# PRAGMA query_only = ON. Layer 2 is mcp_client.guard_sql() in this project,
# which is stricter (single statement, SELECT only, no PRAGMA, salary gate).
readonly = true
# Kept in step with catalog.MAX_ROWS. mcp_client.py asserts they match at
# startup so the two cannot drift apart silently.
max_rows = 50

[[tools]]
name = "search_objects"
source = "company"
